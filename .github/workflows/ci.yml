name: Test CYP role lookup
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Python tests
        run: python -m pytest -q
      - name: Smoke-test served browser and API
        run: |
          python -m uvicorn agents.api:app --host 127.0.0.1 --port 8765 &
          server=$!
          trap 'kill $server' EXIT
          for i in 1 2 3 4 5 6 7 8; do
            if curl --silent --fail http://127.0.0.1:8765/health > /dev/null; then break; fi
            sleep 1
          done
          curl --silent --show-error --fail http://127.0.0.1:8765/ | grep -q "CYP450 Drug Role Lookup"
          curl --silent --show-error --fail http://127.0.0.1:8765/app.js | grep -q "const RECORDS"
          curl --silent --show-error --fail --get --data-urlencode 'query=ketoconazole' http://127.0.0.1:8765/api/lookup | grep -q Ketoconazole
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8765/api/lookup)" = 422
      - name: Compile Python
        run: python -m compileall -q agents cyp_checker.py enrichment.py cli.py simulator.py
      - name: Check browser app
        run: |
          node --check web/app.js
          node --test tests/web.test.cjs
      - name: Verify Python and browser catalogs match
        run: |
          python - <<'PY'
          import json
          import subprocess
          from cyp_checker import CYP_DRUG_DATABASE
          command = "const c=require('./web/app.js');console.log(JSON.stringify(c.RECORDS.map(r=>[r.label,r.key,r.role,r.tier])))"
          records = json.loads(subprocess.check_output(["node", "-e", command], text=True))
          assert records == [list(row) for row in CYP_DRUG_DATABASE]
          PY
