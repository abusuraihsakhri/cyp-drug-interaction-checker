name: Test CYP role lookup
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Python tests
        run: python -m pytest -q
      - name: Compile Python
        run: python -m compileall -q agents cyp_checker.py enrichment.py cli.py simulator.py
      - name: Check browser app
        run: |
          node --check web/app.js
          node --test tests/web.test.cjs
      - name: Verify Python and browser catalogs match
        run: |
          python - <<'PY'
          import json
          import subprocess
          from cyp_checker import CYP_DRUG_DATABASE
          command = "const c=require('./web/app.js');console.log(JSON.stringify(c.RECORDS.map(r=>[r.label,r.key,r.role,r.tier])))"
          records = json.loads(subprocess.check_output(["node", "-e", command], text=True))
          assert records == [list(row) for row in CYP_DRUG_DATABASE]
          PY
