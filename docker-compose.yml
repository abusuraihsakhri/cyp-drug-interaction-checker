version: '3.8'

services:
  cyp-drug-interaction-checker:
    build: .
    container_name: cyp-drug-interaction-checker
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=cyp-drug-interaction-checker-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
